name: Deploy Portfolio to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Prepare cPanel payload
        run: |
          rm -rf cpanel-deploy
          mkdir -p cpanel-deploy/tmp
          cp app.js package.json package-lock.json cpanel-deploy/
          cp -R server build cpanel-deploy/
          rm -rf cpanel-deploy/build/assets/scss
          find cpanel-deploy/build -name "*.map" -type f -delete
          date -u +"%Y-%m-%dT%H:%M:%SZ" > cpanel-deploy/tmp/restart.txt

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to Namecheap
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
        run: |
          lftp -u "$CPANEL_FTP_USERNAME","$CPANEL_FTP_PASSWORD" "ftp://$CPANEL_FTP_SERVER:21" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --continue --only-newer --verbose --parallel=1 ./cpanel-deploy/ "$CPANEL_REMOTE_DIR"
          bye
          EOF
