name: Deploy Portfolio to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Prepare cPanel payload
        run: |
          rm -rf cpanel-deploy
          mkdir -p cpanel-deploy/tmp
          cp app.js package.json package-lock.json cpanel-deploy/
          cp -R server build cpanel-deploy/
          rm -rf cpanel-deploy/build/demos
          rm -rf cpanel-deploy/build/assets/scss
          find cpanel-deploy/build -name "*.map" -type f -delete
          date -u +"%Y-%m-%dT%H:%M:%SZ" > cpanel-deploy/tmp/restart.txt

      - name: Normalize cPanel settings
        id: cpanel
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
        run: |
          set -euo pipefail
          : "${CPANEL_FTP_SERVER:?Missing CPANEL_FTP_SERVER secret}"
          : "${CPANEL_FTP_USERNAME:?Missing CPANEL_FTP_USERNAME secret}"
          : "${CPANEL_FTP_PASSWORD:?Missing CPANEL_FTP_PASSWORD secret}"
          : "${CPANEL_REMOTE_DIR:?Missing CPANEL_REMOTE_DIR secret}"

          remote_dir="${CPANEL_REMOTE_DIR%/}/"
          ftp_port="${CPANEL_FTP_PORT:-21}"
          echo "remote-dir=${remote_dir}" >> "$GITHUB_OUTPUT"
          echo "ftp-port=${ftp_port}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Namecheap via LFTP
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y lftp
          
          PORT="${{ steps.cpanel.outputs.ftp-port }}"
          SERVER="${{ secrets.CPANEL_FTP_SERVER }}"
          USERNAME="${{ secrets.CPANEL_FTP_USERNAME }}"
          PASSWORD="${{ secrets.CPANEL_FTP_PASSWORD }}"
          REMOTE_DIR="${{ steps.cpanel.outputs.remote-dir }}"
          
          # Clean up any potential leading/trailing quotes from secrets
          SERVER=$(echo "$SERVER" | sed -e 's/^"//' -e 's/"$//')
          USERNAME=$(echo "$USERNAME" | sed -e 's/^"//' -e 's/"$//')
          PASSWORD=$(echo "$PASSWORD" | sed -e 's/^"//' -e 's/"$//')
          
          if [ "$PORT" = "21098" ] || [ "$PORT" = "22" ]; then
            echo "Connecting via SFTP on port $PORT..."
            lftp -e "
              set sftp:auto-confirm yes;
              open sftp://${USERNAME}:${PASSWORD}@${SERVER}:${PORT};
              mirror -R --delete --verbose ./cpanel-deploy/ ${REMOTE_DIR};
              quit
            "
          else
            echo "Connecting via FTP/FTPS on port $PORT..."
            lftp -e "
              set ssl:verify-certificate no;
              set ftp:ssl-allow yes;
              set ftp:passive-mode yes;
              open -u \"${USERNAME}\",\"${PASSWORD}\" -p ${PORT} ${SERVER};
              mirror -R --delete --verbose ./cpanel-deploy/ ${REMOTE_DIR};
              quit
            "
          fi

