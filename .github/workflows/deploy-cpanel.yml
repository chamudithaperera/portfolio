name: Deploy Portfolio to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Prepare cPanel payload
        run: |
          rm -rf cpanel-deploy
          mkdir -p cpanel-deploy/tmp
          cp app.js package.json package-lock.json cpanel-deploy/
          cp -R server build cpanel-deploy/
          date -u +"%Y-%m-%dT%H:%M:%SZ" > cpanel-deploy/tmp/restart.txt

      - name: Deploy to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./cpanel-deploy/
          server-dir: ${{ secrets.CPANEL_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.DS_Store
            **/.env
            **/node_modules/**
            **/portfolio-upload.zip
