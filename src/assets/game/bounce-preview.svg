<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">3D Bounce game preview</title>
  <desc id="desc">A red ball bouncing through a bright 3D platform world with keys and eggs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#7ee7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cd600"/>
      <stop offset="1" stop-color="#0e331b"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="0.45" stop-color="#ef233c"/>
      <stop offset="1" stop-color="#8b0013"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#062b36" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <g opacity=".88" fill="#fff">
    <rect x="70" y="68" width="185" height="82" rx="28"/>
    <rect x="646" y="58" width="225" height="98" rx="32"/>
    <rect x="377" y="140" width="150" height="62" rx="24"/>
  </g>
  <g transform="translate(74 318)">
    <path d="M0 64h300l58-58h260l74 74h194v86H0z" fill="#082513" opacity=".35"/>
    <path d="M0 20h300l58-58h260l74 74h194v86H0z" fill="url(#grass)" stroke="#04170d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M8 20h290l58-58h258l73 74h192" fill="none" stroke="#a7ff40" stroke-width="16" stroke-linecap="round" opacity=".9"/>
  </g>
  <g transform="translate(0 0)" filter="url(#shadow)">
    <circle cx="318" cy="270" r="72" fill="url(#orb)" stroke="#170004" stroke-width="10"/>
    <circle cx="344" cy="238" r="18" fill="#fff" opacity=".92"/>
    <ellipse cx="296" cy="277" rx="12" ry="7" fill="#111"/>
    <ellipse cx="340" cy="277" rx="12" ry="7" fill="#111"/>
  </g>
  <g transform="translate(620 230)">
    <circle cx="0" cy="0" r="32" fill="#ffe35a" stroke="#5c3b00" stroke-width="8"/>
    <rect x="24" y="-8" width="82" height="16" rx="8" fill="#ffe35a" stroke="#5c3b00" stroke-width="8"/>
    <rect x="80" y="4" width="18" height="31" rx="5" fill="#ffe35a" stroke="#5c3b00" stroke-width="7"/>
  </g>
  <g transform="translate(744 295)">
    <ellipse cx="0" cy="0" rx="31" ry="43" fill="#fed7aa" stroke="#4b2205" stroke-width="8"/>
    <path d="M-12-6c12 8 24 8 36-2" fill="none" stroke="#fff5df" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  </g>
  <text x="56" y="80" fill="#07313a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">3D Bounce</text>
  <text x="58" y="122" fill="#0b5160" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Red Orb Odyssey</text>
